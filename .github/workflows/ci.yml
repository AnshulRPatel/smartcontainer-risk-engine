name: SmartContainer CI Pipeline

on:

  push:

    branches:
      - main

  pull_request:

    branches:
      - main


jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:

      # ==========================
      # CHECKOUT CODE
      # ==========================

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ==========================
      # SETUP PYTHON
      # ==========================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ==========================
      # INSTALL DEPENDENCIES
      # ==========================

      - name: Install Dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements-api.txt

          pip install -r requirements-dashboard.txt


      # ==========================
      # VALIDATE FASTAPI IMPORTS
      # ==========================

      - name: Validate FastAPI App

        run: |

          python -c "from app.main import app; print('FastAPI app loaded successfully')"


      # ==========================
      # VALIDATE MODEL SERVICE
      # ==========================

      - name: Validate Model Service

        run: |

          python -c "from app.services.model_service import model_service; print('Model service loaded successfully')"


      # ==========================
      # VALIDATE DASHBOARD IMPORTS
      # ==========================

      - name: Validate Streamlit Dashboard

        run: |

          python -c "from dashboard.app import *; print('Dashboard imports successful')"


      # ==========================
      # BUILD DOCKER IMAGE
      # ==========================

      - name: Build Docker Image

        run: |

          docker build -t smartcontainer-risk-engine .